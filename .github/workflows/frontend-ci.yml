
name: Frontend CI

on:
  push:
    branches:
      - main
      - development
      - testing
      - production
      - 'feature/**'

  pull_request:
    branches:
      - main
      - development
      - testing
      - production

permissions:
  contents: read

jobs:

  # 1. Code quality
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint


  # 2. Unit testing
  test:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run


  # 3. Production build
  build:
    name: Vite Production Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: gams-frontend-build
          path: dist/
          retention-days: 7
