
name: Frontend CI/CD

on:
  # Run on pushes to all branches
  push:
    branches:
      - '**'

  # Validate pull requests targeting main
  pull_request:
    branches:
      - main

# Cancel outdated runs for the same branch
concurrency:
  group: frontend-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # 1. Code quality
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint


  # 2. Unit testing
  test:
    name: Vitest
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run


  # 3. Production build
  build:
    name: Vite Production Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: gams-frontend-build
          path: dist/
          retention-days: 7


  # 4. Continuous deployment
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: build

    # Deploy only after successful branch pushes.
    # Pull requests are validation only.
    if: github.event_name == 'push'

    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    steps:
      - name: Download production build
        uses: actions/download-artifact@v7
        with:
          name: gams-frontend-build
          path: dist/

      # Production deployment after merge into main
      - name: Deploy to Netlify Production
        if: github.ref == 'refs/heads/main'
        run: |
          npx --yes netlify-cli@latest deploy \
            --dir=dist \
            --no-build \
            --prod \
            --message="GitHub Actions production deployment"

      # Preview deployment from all other branches
      - name: Deploy Netlify Preview
        if: github.ref != 'refs/heads/main'
        run: |
          npx --yes netlify-cli@latest deploy \
            --dir=dist \
            --no-build \
            --message="GitHub Actions preview: ${{ github.ref_name }}"
